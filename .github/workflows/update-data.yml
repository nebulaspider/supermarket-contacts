name: SupermarketIQ Data Pipeline

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      spider:
        description: 'Run specific spider only (leave empty for all)'
        required: false
        default: ''
      skip_discover:
        description: 'Skip auto-discovery step'
        required: false
        default: 'false'
      force_update:
        description: 'Force update (skip data drop protection)'
        required: false
        default: 'false'
      industries:
        description: 'Directory crawl industries (comma separated)'
        required: false
        default: 'general,retail,electronics,furniture,cosmetics'
      directory_max:
        description: 'Max companies from directory crawl'
        required: false
        default: '80'
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  auto-discover:
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_discover != 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Run auto-discovery
        run: |
          cd scraper
          python auto_discover.py
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: new-brands
          path: data/new_brands.json
          if-no-files-found: ignore

  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Backup current data
        run: |
          if [ -f data/clients.json ]; then
            cp data/clients.json data/clients.backup.json
            echo "Backup done"
          fi
      - name: Run scrapers
        env:
          PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
        run: |
          cd scraper
          if [ -n "${{ github.event.inputs.spider }}" ]; then
            python run.py --scrape-only --spider ${{ github.event.inputs.spider }}
          else
            python run.py --scrape-only
          fi
      - name: Upload scraped data
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data
          path: data/clients.scraped.json
          if-no-files-found: ignore

  directory-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Run directory crawler
        env:
          INDUSTRIES: ${{ github.event.inputs.industries || 'general,retail,electronics,furniture,cosmetics' }}
          MAX_COMPANIES: ${{ github.event.inputs.directory_max || '80' }}
        run: |
          cd scraper
          python run_directory.py
      - name: Upload directory data
        uses: actions/upload-artifact@v4
        with:
          name: directory-data
          path: data/clients.directory.json
          if-no-files-found: ignore

  data-management:
    runs-on: ubuntu-latest
    needs: [directory-crawl]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download scraped data (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: scraped-data
          path: data/
      - name: Download directory data
        uses: actions/download-artifact@v4
        with:
          name: directory-data
          path: data/
      - name: Restore backup
        run: git checkout data/clients.json 2>/dev/null || true
      - name: Merge directory data
        run: |
          cd scraper
          python merge_directory.py
      - name: Run data manager
        run: |
          cd scraper
          python data_manager.py
      - name: Validate output
        id: validate
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f data/clients.json ]; then
            echo "ERROR: No data file generated"
            exit 1
          fi
          NEW_COUNT=$(python3 -c "import json; print(len(json.load(open('data/clients.json'))))")
          echo "New data count: $NEW_COUNT"
          echo "count=$NEW_COUNT" >> $GITHUB_OUTPUT
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "ERROR: Data is empty"
            exit 1
          fi
      - name: Upload final data
        uses: actions/upload-artifact@v4
        with:
          name: final-data
          path: |
            data/clients.json
            data/quality_report.json

  deploy:
    runs-on: ubuntu-latest
    needs: [data-management]
    if: needs.data-management.outputs.rollback != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Download final data
        uses: actions/download-artifact@v4
        with:
          name: final-data
          path: data/
      - name: Commit and push
        run: |
          rm -f data/clients.backup.json data/clients.scraped.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet data/clients.json; then
            echo "No changes, skipping commit"
          else
            git add data/clients.json data/quality_report.json
            git commit -m "Auto update client data"
            git push
            echo "Data committed and pushed"
          fi
      - name: Deployment status
        run: echo "Pipeline completed successfully"
